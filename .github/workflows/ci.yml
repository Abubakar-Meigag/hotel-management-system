name: CI - Build and Push Changed Service

on:
  push:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      room-service: ${{ steps.changes.outputs.room-service }}
      booking-service: ${{ steps.changes.outputs.booking-service }}
      guest-service: ${{ steps.changes.outputs.guest-service }}
      housekeeping-service: ${{ steps.changes.outputs.housekeeping-service }}
      billing-service: ${{ steps.changes.outputs.billing-service }}
      notification-service: ${{ steps.changes.outputs.notification-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          git diff --name-only HEAD~1 HEAD > changed_files.txt
          cat changed_files.txt

          check_service() {
            local folder=$1
            local key=$2
            if grep -q "^$folder/" changed_files.txt || grep -q "^hotel-common/" changed_files.txt; then
              echo "$key=true" >> $GITHUB_OUTPUT
            else
              echo "$key=false" >> $GITHUB_OUTPUT
            fi
          }

          check_service "hotel-api-gateway"
          check_service "hotel-room-service"
          check_service "hotel-booking-service"
          check_service "hotel-guest-service"
          check_service "hotel-housekeeping-service"
          check_service "hotel-billing-service"
          check_service "hotel-notification-service"

  build-and-push:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.api-gateway == 'true' ||
      needs.detect-changes.outputs.room-service == 'true' ||
      needs.detect-changes.outputs.booking-service == 'true' ||
      needs.detect-changes.outputs.guest-service == 'true' ||
      needs.detect-changes.outputs.housekeeping-service == 'true' ||
      needs.detect-changes.outputs.billing-service == 'true' ||
      needs.detect-changes.outputs.notification-service == 'true'
    strategy:
      matrix:
        include:
          - service: hotel-api-gateway
            changed: ${{ needs.detect-changes.outputs.api-gateway }}
            image: abubakarmeigag/hotel-api-gateway
            k8s-key: api-gateway
          - service: hotel-room-service
            changed: ${{ needs.detect-changes.outputs.room-service }}
            image: abubakarmeigag/hotel-room-service
            k8s-key: room-service
          - service: hotel-booking-service
            changed: ${{ needs.detect-changes.outputs.booking-service }}
            image: abubakarmeigag/hotel-booking-service
            k8s-key: booking-service
          - service: hotel-guest-service
            changed: ${{ needs.detect-changes.outputs.guest-service }}
            image: abubakarmeigag/hotel-guest-service
            k8s-key: guest-service
          - service: hotel-housekeeping-service
            changed: ${{ needs.detect-changes.outputs.housekeeping-service }}
            image: abubakarmeigag/hotel-housekeeping-service
            k8s-key: housekeeping-service
          - service: hotel-billing-service
            changed: ${{ needs.detect-changes.outputs.billing-service }}
            image: abubakarmeigag/hotel-billing-service
            k8s-key: billing-service
          - service: hotel-notification-service
            changed: ${{ needs.detect-changes.outputs.notification-service }}
            image: abubakarmeigag/hotel-notification-service
            k8s-key: notification-service
    steps:
      - name: Skip if service not changed
        if: matrix.changed != 'true'
        run: echo "No changes in ${{ matrix.service }}, skipping."

      - name: Checkout code
        if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - name: Set image tag
        if: matrix.changed == 'true'
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to DockerHub
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ matrix.image }}:${{ steps.tag.outputs.tag }}
            ${{ matrix.image }}:latest

      - name: Checkout k8s repo
        if: matrix.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: Abubakar-Meigag/hotel-management-k8s
          token: ${{ secrets.K8S_REPO_TOKEN }}
          path: hotel-management-k8s

      - name: Update image tag in values.yaml
        if: matrix.changed == 'true'
        run: |
          cd hotel-management-k8s
          sed -i "s|image: ${{ matrix.image }}:.*|image: ${{ matrix.image }}:${{ steps.tag.outputs.tag }}|" helm/hotel-services/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/hotel-services/values.yaml
          git commit -m "ci: update ${{ matrix.k8s-key }} image to ${{ steps.tag.outputs.tag }}"
          git push